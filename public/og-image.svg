<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#FAF7F2"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#E8E0D5" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#E8E0D5" stroke-width="1"/>
  <!-- Logo box -->
  <rect x="464" y="145" width="120" height="120" rx="32" fill="#4A7C59"/>
  <text x="524" y="228" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="700" fill="#ffffff">M</text>
  <!-- App name -->
  <text x="600" y="340" text-anchor="middle" font-family="Arial, sans-serif" font-size="64" font-weight="700" fill="#2C1A0E">Monivelle</text>
  <!-- Tagline -->
  <text x="600" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="400" fill="#8B6F5E">Personal Expense Tracker</text>
  <!-- Decorative pill -->
  <rect x="468" y="440" width="264" height="48" rx="24" fill="#4A7C5920"/>
  <text x="600" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#4A7C59">Track · Analyse · Grow</text>
</svg>
